
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Carts509 Voice Shopping</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }
    h1 { color: #ffb84d; }
    input {
      width: 90%;
      max-width: 400px;
      padding: 14px;
      border-radius: 10px;
      font-size: 18px;
    }
    button {
      background: #ffb84d;
      color: #111;
      padding: 15px 22px;
      margin: 12px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
    }
    #status { margin: 20px; }
  </style>
</head>
<body>
  <h1>Carts509</h1>
  <h2>Voice Shopping Assistant</h2>
  <p>Tell me what you want to shop for!</p>

  <input id="search"
         placeholder="What are you looking for?">

  <div>
    <button onclick="listen()">🎤 Speak</button>
    <button onclick="shop()">Search Amazon</button>
  </div>

  <p id="status">Ready to shop!</p>

  <script>
    const input = document.getElementById("search");
    const status = document.getElementById("status");

    function shop() {
      const item = input.value.trim();
      if (!item) {
        status.textContent = "Enter an item first.";
        return;
      }
      const url = "https://www.amazon.com/s?k="
        + encodeURIComponent(item);
      window.open(url, "_blank", "noopener");
    }

    function listen() {
      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        status.textContent =
          "Voice recognition is unavailable in this browser. Type your search instead.";
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.onresult = (event) => {
        input.value = event.results[0][0].transcript;
        status.textContent = "Ready to search!";
      };
      recognition.onerror = (event) => {
        status.textContent = "Microphone error: " + event.error;
      };
      recognition.start();
      status.textContent = "Listening...";
    }
  </script>
</body>
</html>
